name: crm-production
 
services:
  # ==========================================================================
  # PostgreSQL
  # ==========================================================================
  postgres:
    image: postgres:18-alpine
    container_name: crm-postgres
    restart: unless-stopped

    env_file:
    - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    # Do not expose 5432 to the VPS public interface.
    expose:
      - "5432"

    networks:
      - crm-internal

    mem_limit: 768m
    cpus: 0.75

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  # ==========================================================================
  # Redis
  # ==========================================================================
  redis:
    image: redis:8-alpine
    container_name: crm-redis
    restart: unless-stopped
  
    env_file:
    - .env

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a '${REDIS_PASSWORD}' ping | grep PONG"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    expose:
      - "6379"

    networks:
      - crm-internal

    mem_limit: 256m
    cpus: 0.25

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  # ==========================================================================
  # RabbitMQ
  # ==========================================================================
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: crm-rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

    expose:
      - "5672"
      - "15672"

    networks:
      - crm-internal

    mem_limit: 512m
    cpus: 0.50

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  # ==========================================================================
  # Spring Boot backend
  # ==========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: crm-backend:latest
    container_name: crm-backend
    restart: unless-stopped
    init: true

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    env_file:
    - .env

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8080

      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      SPRING_RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_DEFAULT_VHOST:-/}

      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRY_MS: ${JWT_ACCESS_TOKEN_EXPIRY_MS}
      JWT_REFRESH_TOKEN_EXPIRY_MS: ${JWT_REFRESH_TOKEN_EXPIRY_MS}

      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      APP_BASE_URL: ${APP_BASE_URL}
      FRONTEND_URL: ${FRONTEND_URL}
    volumes:
      - backend_logs:/app/logs
      - backend_uploads:/app/uploads

    ports:
      - "8091:8080"

    networks:
      - crm-internal
      - crm-public

    mem_limit: 1024m
    cpus: 1.0

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"


  # ==========================================================================
  # Next.js frontend
  # ==========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Browser requests use the same public origin through Nginx.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

    image: crm-frontend:latest
    container_name: crm-frontend
    restart: unless-stopped
    init: true

    depends_on:
      backend:
        condition: service_healthy

    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0

      # Server-side Next.js code can use the internal container address.
      INTERNAL_API_URL: http://backend:8080/api/v1

    ports:
      - "0.0.0.0:3005:3000"

    networks:
      - crm-public

    mem_limit: 768m
    cpus: 0.75

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"


  # ==========================================================================
  # Nginx reverse proxy
  # ==========================================================================
  nginx:
    image: nginx:alpine
    container_name: crm-nginx
    restart: unless-stopped

    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

    ports:
      - "80:80"
      # Enable after certificates are configured:
      # - "443:443"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Enable later for TLS:
      # - ./certbot/conf:/etc/letsencrypt:ro
      # - ./certbot/www:/var/www/certbot:ro

    networks:
      - crm-public

    mem_limit: 128m
    cpus: 0.25

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"


volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  backend_logs:
  backend_uploads:


networks:
  crm-internal:
    driver: bridge
    internal: true

  crm-public:
    driver: bridge