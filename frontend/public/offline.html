<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="robots" content="noindex" />
    <title>Offline | Sellspark CRM</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.25rem
          max(1.5rem, env(safe-area-inset-bottom));
        background: #f8fafc;
        color: #0f172a;
      }

      main {
        width: 100%;
        max-width: 26rem;
        border: 1px solid #e2e8f0;
        border-radius: 1rem;
        background: #ffffff;
        padding: 2rem 1.5rem;
        text-align: center;
        box-shadow: 0 12px 32px rgb(15 23 42 / 8%);
      }

      .mark {
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto 1.25rem;
        display: grid;
        place-items: center;
        border-radius: 0.875rem;
        background: #4f46e5;
        color: #ffffff;
        font-size: 1.5rem;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: 1.375rem;
        line-height: 1.25;
      }

      p {
        margin: 0.75rem 0 0;
        color: #64748b;
        font-size: 0.9375rem;
        line-height: 1.55;
      }

      button {
        min-height: 2.75rem;
        margin-top: 1.5rem;
        border: 0;
        border-radius: 0.625rem;
        background: #4f46e5;
        color: #ffffff;
        padding: 0.625rem 1.25rem;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 3px solid rgb(79 70 229 / 35%);
        outline-offset: 2px;
      }

      .note {
        font-size: 0.8125rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">S</div>
      <h1>You are offline</h1>
      <p>
        Sellspark CRM cannot reach the network right now. Check your connection, then try again.
      </p>
      <p class="note">
        If you already submitted a form, reopen the page after reconnecting before retrying to
        avoid duplicate changes.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
