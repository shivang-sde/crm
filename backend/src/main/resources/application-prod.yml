spring:
  application:
    name: crm

  docker:
    compose:
      enabled: false

  datasource:
    url: ${DATABASE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 120000

      # Keep disabled or high in production.
      # A very low value reports Flyway as an apparent leak.
      leak-detection-threshold: ${DB_LEAK_DETECTION_THRESHOLD:60000}

      data-source-properties:
        timezone: UTC

  flyway:
    enabled: true
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER}
    password: ${RABBITMQ_DEFAULT_PASS}
    publisher-confirm-type: correlated
    publisher-returns: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
    allowed-headers: "Authorization,Content-Type"
    allow-credentials: true
  reminders:
    enabled: true
    poll-delay-ms: 5000
    batch-size: 100
    max-attempts: 3
    processing-timeout-seconds: 300
  recurrence:
    enabled: true
    generation-delay-ms: 60000
    generation-window-days: 30
    batch-size: 100
  outbox:
    poll-delay-ms: ${OUTBOX_POLL_DELAY_MS:5000}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    stale-after-seconds: ${OUTBOX_STALE_AFTER_SECONDS:300}
    confirm-timeout-ms: ${OUTBOX_CONFIRM_TIMEOUT_MS:5000}
    max-retry-delay-seconds: ${OUTBOX_MAX_RETRY_DELAY_SECONDS:300}
  workflow-runtime:
    poll-delay-ms: ${WORKFLOW_RUNTIME_POLL_DELAY_MS:5000}
    batch-size: ${WORKFLOW_RUNTIME_BATCH_SIZE:25}

server:
  port: ${SERVER_PORT:8080}

  forward-headers-strategy: framework

  servlet:
    session:
      cookie:
        secure: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  file:
    name: /app/logs/application.log
