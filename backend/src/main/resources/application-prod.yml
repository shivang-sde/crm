spring:
  application:
    name: crm

  docker:
    compose:
      enabled: false

  main:
    allow-bean-definition-overriding: true

  datasource:
    url: ${DATABASE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 120000

      # Keep disabled or high in production.
      # A very low value reports Flyway as an apparent leak.
      leak-detection-threshold: ${DB_LEAK_DETECTION_THRESHOLD:60000}

      data-source-properties:
        timezone: UTC

  # ── JPA / Hibernate ──
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER}
    password: ${RABBITMQ_DEFAULT_PASS}
    publisher-confirm-type: correlated
    publisher-returns: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
    allowed-headers: "Authorization,Content-Type,X-API-Key,X-Commercial-Token"
    allow-credentials: true
  reminders:
    enabled: true
    poll-delay-ms: 5000
    batch-size: 100
    max-attempts: 3
    processing-timeout-seconds: 300
  recurrence:
    enabled: true
    poll-delay-ms: 30000
    max-attempts: 5
    generation-delay-ms: 60000
    generation-window-days: 30
    batch-size: 100
  tickets:
    sla:
      response-minutes: ${TICKET_SLA_RESPONSE_MINUTES:240}
      resolution-minutes: ${TICKET_SLA_RESOLUTION_MINUTES:1440}
      breach-scan-enabled: true
      breach-scan-delay-ms: ${TICKET_SLA_BREACH_SCAN_DELAY_MS:60000}
  entitlements:
    expiry-enabled: true
    expiry-delay-ms: ${ENTITLEMENT_EXPIRY_DELAY_MS:86400000}
    renewal-task-enabled: true
    renewal-task-delay-ms: ${ENTITLEMENT_RENEWAL_TASK_DELAY_MS:86400000}
  outbox:
    poll-delay-ms: ${OUTBOX_POLL_DELAY_MS:5000}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    stale-after-seconds: ${OUTBOX_STALE_AFTER_SECONDS:300}
    confirm-timeout-ms: ${OUTBOX_CONFIRM_TIMEOUT_MS:5000}
    max-retry-delay-seconds: ${OUTBOX_MAX_RETRY_DELAY_SECONDS:300}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:10}
  rabbitmq:
    consumer:
      prefetch: ${RABBITMQ_CONSUMER_PREFETCH:50}
      concurrency: ${RABBITMQ_CONSUMER_CONCURRENCY:1}
      max-concurrency: ${RABBITMQ_CONSUMER_MAX_CONCURRENCY:4}
      retry:
        max-attempts: ${RABBITMQ_CONSUMER_RETRY_MAX_ATTEMPTS:3}
        initial-interval-ms: ${RABBITMQ_CONSUMER_RETRY_INITIAL_INTERVAL_MS:500}
        multiplier: ${RABBITMQ_CONSUMER_RETRY_MULTIPLIER:2.0}
        max-interval-ms: ${RABBITMQ_CONSUMER_RETRY_MAX_INTERVAL_MS:10000}
  resilience:
    redis:
      open-duration-ms: ${REDIS_RESILIENCE_OPEN_DURATION_MS:15000}
  operator-tools:
    enabled: ${OPERATOR_TOOLS_ENABLED:false}
    dlq:
      management-url: ${RABBITMQ_MANAGEMENT_URL:}
      vhost: ${RABBITMQ_MANAGEMENT_VHOST:/}
      username: ${RABBITMQ_MANAGEMENT_USERNAME:}
      password: ${RABBITMQ_MANAGEMENT_PASSWORD:}
      page-size: ${OPERATOR_TOOLS_DLQ_PAGE_SIZE:20}
      max-scan-messages: ${OPERATOR_TOOLS_DLQ_MAX_SCAN:50}
    outbox:
      page-size: ${OPERATOR_TOOLS_OUTBOX_PAGE_SIZE:20}
  security:
    token-blacklist:
      redis-failure-mode: ${TOKEN_BLACKLIST_REDIS_FAILURE_MODE:BYPASS}
    login:
      throttle:
        enabled: ${LOGIN_THROTTLE_ENABLED:true}
        max-failed-attempts: ${LOGIN_THROTTLE_MAX_FAILED_ATTEMPTS:5}
        lock-duration-ms: ${LOGIN_THROTTLE_LOCK_DURATION_MS:900000}
        max-fallback-keys: ${LOGIN_THROTTLE_MAX_FALLBACK_KEYS:10000}
  workflow-runtime:
    poll-delay-ms: ${WORKFLOW_RUNTIME_POLL_DELAY_MS:5000}
    batch-size: ${WORKFLOW_RUNTIME_BATCH_SIZE:25}
    max-chain-depth: ${WORKFLOW_MAX_CHAIN_DEPTH:5}
    retry:
      enabled: ${WORKFLOW_NODE_RETRY_ENABLED:false}
      max-attempts: ${WORKFLOW_NODE_RETRY_MAX_ATTEMPTS:3}
      initial-delay-seconds: ${WORKFLOW_NODE_RETRY_INITIAL_DELAY_SECONDS:5}
      max-delay-seconds: ${WORKFLOW_NODE_RETRY_MAX_DELAY_SECONDS:300}
      jitter: ${WORKFLOW_NODE_RETRY_JITTER:true}
      batch-size: ${WORKFLOW_NODE_RETRY_BATCH_SIZE:25}
      poll-delay-ms: ${WORKFLOW_NODE_RETRY_POLL_DELAY_MS:5000}
    execution-recovery:
      enabled: ${WORKFLOW_EXECUTION_RECOVERY_ENABLED:true}
      stale-after-seconds: ${WORKFLOW_EXECUTION_RECOVERY_STALE_AFTER_SECONDS:300}
      batch-size: ${WORKFLOW_EXECUTION_RECOVERY_BATCH_SIZE:100}
      fixed-delay-ms: ${WORKFLOW_EXECUTION_RECOVERY_FIXED_DELAY_MS:60000}
  

  outbound-http:
    connect-timeout-ms: ${OUTBOUND_HTTP_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${OUTBOUND_HTTP_READ_TIMEOUT_MS:10000}
    max-request-bytes: ${OUTBOUND_HTTP_MAX_REQUEST_BYTES:1048576}
    max-response-bytes: ${OUTBOUND_HTTP_MAX_RESPONSE_BYTES:1048576}

  import:
    csv:
      max-file-size-bytes: 10485760
      max-rows: 5000
      max-columns: 50
  
  commercial-integration:
    enabled: ${COMMERCIAL_INTEGRATION_ENABLED:true}

# ── JWT Configuration ──
# No fallback value. A missing JWT_SECRET aborts startup during placeholder
# resolution, and ProductionSecuritySecretsValidator (prod profile only) rejects
# the example key that ships in application.yaml, so production can never silently
# run on a publicly known signing key.
jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-ms: 36000000
  refresh-token-expiry-days: 7

integration:
  security:
    encryption-key: ${INTEGRATION_ENCRYPTION_KEY}


server:
  port: ${SERVER_PORT:8080}

  forward-headers-strategy: framework

  servlet:
    session:
      cookie:
        secure: true
        same-site: lax

    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  file:
    name: /app/logs/application.log
