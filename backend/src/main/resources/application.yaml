spring:
  application:
    name: crm

  main:
    allow-bean-definition-overriding: true

  # ── PostgreSQL ──
  datasource:
    url: jdbc:postgresql://localhost:5432/crm
    username: postgres
    password: [PASSWORD]
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        timezone: UTC

  # ── JPA / Hibernate ──
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  # ── Flyway WITH EXPLICIT TIMEZONE FIX ──
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    init-sqls: "SET TIME ZONE 'UTC'"
    jdbc-properties:
      TimeZone: UTC
  # ── Redis & RabbitMQ (Spring Boot 3+ Structure) ──
  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis
    redis:
      time-to-live: 600000  # 10 minutes

  # NOTE: In newer Spring Boot versions, rabbitmq is grouped under spring.rabbitmq
  rabbitmq:
    host: localhost
    port: 5672
    username: rabbitmq
    password: [PASSWORD]

app:
  cors:
    allowed-origins:  ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
    allowed-headers: "Authorization,Content-Type"
    allow-credentials: true

# ── JWT Configuration ──
jwt:
  secret: Y3JtLWFwcGxpY2F0aW9uLXN1cGVyLXNlY3JldC1rZXktdGhhdC1pcy1sb25nLWVub3VnaC1mb3ItaHMyNTY=
  access-token-expiry-ms: 36000000 # 15 minutes
  refresh-token-expiry-days: 7 # 7 days

# ── Server ──
server:
  port: 8080

# ── Actuator ──
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

# ── Logging ──
logging:
  level:
    com.shivang.crm: DEBUG
    # org.springframework: DEBUG
    # com.shivang.crm.modules: DEBUGs
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
