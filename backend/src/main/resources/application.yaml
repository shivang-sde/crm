spring:
  application:
    name: crm

  docker:
    compose:
      enabled: false
      file: ./docker-compose.yaml

  main:
    allow-bean-definition-overriding: true

  # ── PostgreSQL ──
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/crm}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:crm_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Keep your existing timezone setup
      data-source-properties:
        timezone: UTC

      # 1. Reduce connection lifetime to 10 minutes (600000 ms)
      # This ensures connections refresh before firewalls/DBs kill them during app stutters
      max-lifetime: 600000

      # 2. Add an explicit keep-alive heartbeat every 30 seconds (30000 ms)
      # This forces your app to ping PostgreSQL to keep idle sockets active
      keepalive-time: 30000

      # 3. Prevent the app from hanging forever if the database fails to respond
      connection-timeout: 30000

      # 4. Optional debug tool: alerts you if a thread holds a connection for too long
      # Logs an error if a business logic thread retains a connection over 5 seconds
      leak-detection-threshold: 60000

  # ── JPA / Hibernate ──
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  # ── Flyway ──
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    init-sqls: "SET TIME ZONE 'UTC'"
    jdbc-properties:
      TimeZone: UTC

  # ── Redis ──
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis
    redis:
      time-to-live: 600000

  # ── RabbitMQ ──
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:rabbitmq}
    password: ${RABBITMQ_DEFAULT_PASS:crm_password}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
    allowed-headers: "Authorization,Content-Type"
    allow-credentials: true

# ── JWT Configuration ──
jwt:
  secret: ${JWT_SECRET:Y3JtLWFwcGxpY2F0aW9uLXN1cGVyLXNlY3JldC1rZXktdGhhdC1pcy1sb25nLWVub3VnaC1mb3ItaHMyNTY=}
  access-token-expiry-ms: 36000000
  refresh-token-expiry-days: 7

integration:
  security:
    encryption-key: ${INTEGRATION_ENCRYPTION_KEY:XKM1/RmCg8xvU/iYTEY81mZUgZDWeHxwH3Cpqwz1D2w=}

# ── Server ──
server:
  port: 8080

# ── Actuator ──
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

# ── Logging ──
logging:
  level:
    com.shivang.crm: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
