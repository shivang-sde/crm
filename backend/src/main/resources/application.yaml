spring:
  application:
    name: crm

  docker:
    compose:
      enabled: false
      file: ./docker-compose.yaml

  main:
    allow-bean-definition-overriding: true

  # ── PostgreSQL ──
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/crm?sslmode=disable}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:crm_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Keep your existing timezone setup
      data-source-properties:
        timezone: UTC
        sslmode: disable
        ssl: false

      maximum-pool-size: 5
      minimum-idle: 2

      # 1. Reduce connection lifetime to 10 minutes (600000 ms)
      # This ensures connections refresh before firewalls/DBs kill them during app stutters
      max-lifetime: 600000

      # 2. Add an explicit keep-alive heartbeat every 30 seconds (30000 ms)
      # This forces your app to ping PostgreSQL to keep idle sockets active
      keepalive-time: 30000

      # 3. Prevent the app from hanging forever if the database fails to respond
      connection-timeout: 45000

      # 4. Optional debug tool: alerts you if a thread holds a connection for too long
      # Logs an error if a business logic thread retains a connection over 5 seconds
      leak-detection-threshold: 60000

      # 5. 
      initialization-fail-timeout: 0

  # ── JPA / Hibernate ──
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  # ── Flyway ──
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    init-sqls: "SET TIME ZONE 'UTC'"
    jdbc-properties:
      TimeZone: UTC

  # ── Scheduled jobs ──
  # Nine @Scheduled jobs share this pool. Previously the default pool size of 1
  # meant a slow job (e.g. the outbox publisher blocking on a publisher confirm
  # while RabbitMQ is down) stalled reminders, recurrence, entitlement expiry and
  # all workflow dispatch. Each @Scheduled trigger still never overlaps itself.
  task:
    scheduling:
      pool:
        size: ${SCHEDULER_POOL_SIZE:10}

  # ── Redis ──
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis
    redis:
      time-to-live: 600000

  # ── RabbitMQ ──
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:rabbitmq}
    password: ${RABBITMQ_DEFAULT_PASS:crm_password}
    publisher-confirm-type: correlated
    publisher-returns: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
    allowed-headers: "Authorization,Content-Type,X-API-Key,X-Commercial-Token"
    allow-credentials: true
  reminders:
    enabled: true
    poll-delay-ms: 30000
    batch-size: 20
    max-attempts: 3
    processing-timeout-seconds: 300
  entitlements:
    expiry-enabled: true
    expiry-delay-ms: ${ENTITLEMENT_EXPIRY_DELAY_MS:86400000}
    renewal-task-enabled: true
    renewal-task-delay-ms: ${ENTITLEMENT_RENEWAL_TASK_DELAY_MS:86400000}
  recurrence:
    enabled: true
    generation-delay-ms: 60000
    generation-window-days: 30
    batch-size: 20
  outbox:
    poll-delay-ms: ${OUTBOX_POLL_DELAY_MS:30000}
    batch-size: ${OUTBOX_BATCH_SIZE:20}
    stale-after-seconds: ${OUTBOX_STALE_AFTER_SECONDS:300}
    confirm-timeout-ms: ${OUTBOX_CONFIRM_TIMEOUT_MS:5000}
    max-retry-delay-seconds: ${OUTBOX_MAX_RETRY_DELAY_SECONDS:300}
    # Publish attempt budget per row. On exhaustion the row moves to the terminal
    # DEAD state and is never selected again without an explicit requeue.
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:10}
  rabbitmq:
    consumer:
      prefetch: ${RABBITMQ_CONSUMER_PREFETCH:50}
      concurrency: ${RABBITMQ_CONSUMER_CONCURRENCY:1}
      max-concurrency: ${RABBITMQ_CONSUMER_MAX_CONCURRENCY:4}
      retry:
        # Total deliveries per message, including the first. Deterministic failures
        # (business rules, malformed payloads, integrity violations) are dead-lettered
        # immediately without consuming this budget.
        max-attempts: ${RABBITMQ_CONSUMER_RETRY_MAX_ATTEMPTS:3}
        initial-interval-ms: ${RABBITMQ_CONSUMER_RETRY_INITIAL_INTERVAL_MS:500}
        multiplier: ${RABBITMQ_CONSUMER_RETRY_MULTIPLIER:2.0}
        max-interval-ms: ${RABBITMQ_CONSUMER_RETRY_MAX_INTERVAL_MS:10000}
  resilience:
    redis:
      # How long Redis-backed calls keep bypassing the server after a connection
      # failure. Keeps a Redis outage from turning into a 5xx storm on the auth path
      # and avoids logging once per request. Recovers automatically afterwards.
      open-duration-ms: ${REDIS_RESILIENCE_OPEN_DURATION_MS:15000}
  operator-tools:
    # Master switch for OPS-01 (RabbitMQ DLQ) and OPS-02 (outbox DEAD) tooling.
    # Off by default: the capability is inert until an operator opts in AND supplies
    # the RabbitMQ management API URL, which DLQ inspection requires because AMQP
    # has no non-destructive queue browse primitive.
    enabled: ${OPERATOR_TOOLS_ENABLED:false}
    dlq:
      management-url: ${RABBITMQ_MANAGEMENT_URL:}
      vhost: ${RABBITMQ_MANAGEMENT_VHOST:/}
      username: ${RABBITMQ_MANAGEMENT_USERNAME:}
      password: ${RABBITMQ_MANAGEMENT_PASSWORD:}
      connect-timeout-ms: ${RABBITMQ_MANAGEMENT_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${RABBITMQ_MANAGEMENT_READ_TIMEOUT_MS:5000}
      page-size: ${OPERATOR_TOOLS_DLQ_PAGE_SIZE:20}
      max-scan-messages: ${OPERATOR_TOOLS_DLQ_MAX_SCAN:50}
      confirm-timeout-ms: ${OPERATOR_TOOLS_DLQ_CONFIRM_TIMEOUT_MS:5000}
      # Exchanges a re-drive may target. Empty means "only the CRM event exchange".
      allowed-exchanges: []
    outbox:
      page-size: ${OPERATOR_TOOLS_OUTBOX_PAGE_SIZE:20}
      max-page-size: ${OPERATOR_TOOLS_OUTBOX_MAX_PAGE_SIZE:200}
  security:
    token-blacklist:
      # BYPASS = a token that was explicitly logged out stays usable until its
      # natural expiry while Redis is down (JWT signature verification is
      # unaffected). DENY = strict fail-closed revocation, at the cost of rejecting
      # all traffic during the outage.
      redis-failure-mode: ${TOKEN_BLACKLIST_REDIS_FAILURE_MODE:BYPASS}
    login:
      throttle:
        enabled: ${LOGIN_THROTTLE_ENABLED:true}
        max-failed-attempts: ${LOGIN_THROTTLE_MAX_FAILED_ATTEMPTS:5}
        lock-duration-ms: ${LOGIN_THROTTLE_LOCK_DURATION_MS:900000}
        max-fallback-keys: ${LOGIN_THROTTLE_MAX_FALLBACK_KEYS:10000}
  workflow-runtime:
    poll-delay-ms: ${WORKFLOW_RUNTIME_POLL_DELAY_MS:45000}
    batch-size: ${WORKFLOW_RUNTIME_BATCH_SIZE:10}
    max-chain-depth: ${WORKFLOW_MAX_CHAIN_DEPTH:5}
    retry:
      enabled: ${WORKFLOW_NODE_RETRY_ENABLED:false}
      max-attempts: ${WORKFLOW_NODE_RETRY_MAX_ATTEMPTS:3}
      initial-delay-seconds: ${WORKFLOW_NODE_RETRY_INITIAL_DELAY_SECONDS:5}
      max-delay-seconds: ${WORKFLOW_NODE_RETRY_MAX_DELAY_SECONDS:300}
      jitter: ${WORKFLOW_NODE_RETRY_JITTER:true}
      batch-size: ${WORKFLOW_NODE_RETRY_BATCH_SIZE:15}
      poll-delay-ms: ${WORKFLOW_NODE_RETRY_POLL_DELAY_MS:45000}
    execution-recovery:
      enabled: ${WORKFLOW_EXECUTION_RECOVERY_ENABLED:true}
      stale-after-seconds: ${WORKFLOW_EXECUTION_RECOVERY_STALE_AFTER_SECONDS:300}
      batch-size: ${WORKFLOW_EXECUTION_RECOVERY_BATCH_SIZE:100}
      fixed-delay-ms: ${WORKFLOW_EXECUTION_RECOVERY_FIXED_DELAY_MS:60000}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  outbound-http:
    connect-timeout-ms: ${OUTBOUND_HTTP_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${OUTBOUND_HTTP_READ_TIMEOUT_MS:10000}
    max-request-bytes: ${OUTBOUND_HTTP_MAX_REQUEST_BYTES:1048576}
    max-response-bytes: ${OUTBOUND_HTTP_MAX_RESPONSE_BYTES:1048576}

  import:
    csv:
      max-file-size-bytes: 10485760
      max-rows: 5000
      max-columns: 50
  commercial-integration:
    enabled: ${COMMERCIAL_INTEGRATION_ENABLED:true}

# ── JWT Configuration ──
jwt:
  secret: ${JWT_SECRET:Y3JtLWFwcGxpY2F0aW9uLXN1cGVyLXNlY3JldC1rZXktdGhhdC1pcy1sb25nLWVub3VnaC1mb3ItaHMyNTY=}
  access-token-expiry-ms: 36000000
  refresh-token-expiry-days: 7

integration:
  security:
    encryption-key: ${INTEGRATION_ENCRYPTION_KEY:XKM1/RmCg8xvU/iYTEY81mZUgZDWeHxwH3Cpqwz1D2w=}

# ── Server ──
server:
  port: 8080

# ── Actuator ──
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

# ── Logging ──
logging:
  level:
    com.shivang.crm: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
